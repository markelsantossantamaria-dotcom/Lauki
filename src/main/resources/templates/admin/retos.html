<!DOCTYPE html>
<!-- =========================================================================
     ARCHIVO: src/main/resources/templates/admin/retos.html
     ROL: ADMINISTRADOR
     VISTA: Gestión de Retos (Listado, Edición, Finalización y Modal de Creación)
     CONTROLADOR: AdminController.java -> @GetMapping("/admin/retos") devuelve "admin/retos"
     ========================================================================= -->
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org" 
      data-layout-decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Retos · Administrador</title>

    <!-- =========================================================================
         SOLO PARA VISTA PREVIA EN VS CODE (Live Server):
         th:remove="all" hace que Spring Boot borre estas líneas al unir con layout.html.
         ========================================================================= -->
    <script th:remove="all">
        document.documentElement.setAttribute('data-theme', localStorage.getItem('lauki-theme') || 'light');
        document.documentElement.setAttribute('data-accent', localStorage.getItem('lauki-accent') || 'magenta');
        document.documentElement.setAttribute('data-sidebar', localStorage.getItem('lauki-sidebar') || 'expanded');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" th:remove="all">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" th:remove="all">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" th:remove="all">
    <link rel="stylesheet" href="../../static/css/styles.css" th:remove="all">
</head>
<body>

    <!-- Contenedor de vista previa (th:remove="tag" lo elimina en Spring Boot dejando solo el fragmento) -->
    <div class="admin" th:remove="tag">

        <!-- TOPBAR MÓVIL (Solo vista previa VS Code) -->
        <header class="topbar" th:remove="all">
            <button type="button" class="btn p-0 text-reset" id="mobile-menu-toggle" aria-label="Abrir menú">
                <i class="bi bi-list fs-3"></i>
            </button>
            <h2 class="m-0 font-display fs-5 fw-bold">
                Lauki<span style="color: var(--color-accent); font-size: 0.6em; vertical-align: 0.1em;">▮</span>
            </h2>
            <div class="user-menu-btn p-0" style="width: 32px; height: 32px; justify-content: center;">
                <span style="font-size: 12px; font-weight:bold;">AL</span>
            </div>
        </header>

        <div class="sidebar-backdrop d-none" id="sidebar-backdrop" th:remove="all"></div>

        <!-- SIDEBAR (Solo vista previa VS Code - Spring Boot usa la de layout.html) -->
        <aside class="sidebar d-flex flex-column" th:remove="all">
            <div class="sidebar__header p-4 d-flex align-items-center gap-3">
                <button type="button" class="btn p-0 text-reset sidebar__toggle" data-sidebar-toggle aria-label="Colapsar menú">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <h2 class="sidebar__brand m-0 font-display fw-bold" style="font-size: 28px;">
                    Lauki<span style="color: var(--color-accent); font-size: 0.6em; vertical-align: 0.1em;">▮</span>
                </h2>
            </div>

            <nav class="flex-grow-1 px-3 mt-2" aria-label="Menú principal">
                <div id="menu-admin">
                    <a href="./panel.html" title="Inicio" class="sidebar__link mb-1">
                        <i class="bi bi-house"></i> <span>Inicio</span>
                    </a>
                    <a href="./cursos.html" title="Cursos" class="sidebar__link mb-1">
                        <i class="bi bi-book"></i> <span>Cursos</span>
                    </a>
                    <a href="./usuarios.html" title="Usuarios" class="sidebar__link mb-1">
                        <i class="bi bi-people"></i> <span>Usuarios</span>
                    </a>
                    <a href="./grupos.html" title="Grupos" class="sidebar__link mb-1">
                        <i class="bi bi-grid"></i> <span>Grupos</span>
                    </a>
                    <a href="./retos.html" title="Retos" class="sidebar__link sidebar__link--active mb-1">
                        <i class="bi bi-flag"></i> <span>Retos</span>
                    </a>
                </div>
            </nav>

            <!-- Controles de Acento y Tema idénticos a login.html y layout.html -->
            <div class="sidebar__footer p-4 border-top d-flex justify-content-between align-items-center" style="border-color: var(--color-border-subtle) !important;">
                <div class="accent-group" role="group" aria-label="Selector de color de acento">
                    <button type="button" class="accent-swatch accent-swatch--magenta active" data-accent-option="magenta" aria-label="Acento Magenta">
                        <i class="bi bi-check2"></i>
                    </button>
                    <button type="button" class="accent-swatch accent-swatch--cyan" data-accent-option="cyan" aria-label="Acento Cian">
                        <i class="bi bi-check2"></i>
                    </button>
                </div>

                <button type="button" class="theme-circle-btn shadow-sm" id="theme-toggle" aria-label="Cambiar tema">
                    <i class="bi bi-moon"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="admin__main" th:remove="tag">

            <!-- Menú de usuario (Solo vista previa VS Code) -->
            <div class="d-none d-md-flex justify-content-end mb-3 dropdown" th:remove="all">
                <button class="user-menu-btn" data-bs-toggle="dropdown">
                    <div class="avatar">AL</div>
                    <span style="font-size: 14px; font-weight: 500;">Administrador Lauki</span>
                    <i class="bi bi-chevron-down" style="font-size: 12px; color: var(--color-text-secondary);"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" style="background-color: var(--color-bg-surface); border-color: var(--color-border-subtle);">
                    <li>
                        <a class="dropdown-item text-danger" href="../login.html">
                            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                        </a>
                    </li>
                </ul>
            </div>

            <!-- =========================================================================
                 BLOQUE REAL QUE SPRING BOOT INYECTA EN layout.html
                 ========================================================================= -->
            <div data-layout-fragment="content">
                
                <!-- Cabecera con título a la izquierda y botón + Nuevo Reto a la derecha -->
                <header class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                    <div>
                        <p class="font-mono text-uppercase m-0" style="color: var(--color-text-secondary); font-size: 12px; letter-spacing: 0.05em;">
                            Administración
                        </p>
                        <h1 class="font-display fw-bold mt-1 mb-0" style="font-size: 32px;">
                            Gestión de Retos
                        </h1>
                    </div>

                    <button type="button" class="btn--primary" data-modal-open="modal-nuevo-reto">
                        <i class="bi bi-plus-lg"></i>
                        <span>Nuevo Reto</span>
                    </button>
                </header>

                <!-- =========================================================================
                     BACKEND (AdminController.java & Reto.java): TABLA DE RETOS
                     - Iterar en el tbody con th:each="reto : ${retos}".
                     - Nombre del reto: th:text="${reto.nombre}"
                     - Grupo asignado: th:text="${reto.grupo != null ? reto.grupo.nombre : 'Sin grupo'}"
                     - Estado: mostrar badge-status--active con th:if="${!reto.finalizado}"
                       y badge-status--finished con th:if="${reto.finalizado}".
                     - Finalizar reto: conectar th:action="@{/admin/retos/{id}/finalizar(id=${reto.id})}"
                     ========================================================================= -->
                <section class="table-card" aria-label="Listado de retos">
                    <table class="lauki-table">
                        <thead>
                            <tr>
                                <th>Reto</th>
                                <th>Grupo</th>
                                <th>Estado</th>
                                <th class="text-end"><span class="visually-hidden">Acciones</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Ejemplo fila 1 (BACKEND: reemplazar filas de ejemplo por th:each="reto : ${retos}") -->
                            <tr>
                                <td class="fw-semibold">Tienda online</td>
                                <td>Equipo Alfa</td>
                                <td>
                                    <span class="badge-status badge-status--active">En curso</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex align-items-center gap-2">
                                        <button type="button" 
                                                class="btn--row-icon" 
                                                title="Editar reto"
                                                aria-label="Editar reto"
                                                data-modal-open="modal-editar-reto"
                                                data-reto-id="1"
                                                data-reto-nombre="Tienda online"
                                                data-reto-descripcion="Desarrollo de tienda online con catálogo, carrito de compra y pasarela de pago."
                                                data-reto-grupo-id="1">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <form action="#" method="post" class="m-0 d-inline">
                                            <button type="submit" class="btn--row-finish">
                                                <i class="bi bi-flag"></i>
                                                <span>Finalizar Reto</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <!-- Ejemplo fila 2 (eliminar al conectar th:each) -->
                            <tr>
                                <td class="fw-semibold">App de reservas</td>
                                <td>Equipo Beta</td>
                                <td>
                                    <span class="badge-status badge-status--active">En curso</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex align-items-center gap-2">
                                        <button type="button" 
                                                class="btn--row-icon" 
                                                title="Editar reto"
                                                aria-label="Editar reto"
                                                data-modal-open="modal-editar-reto"
                                                data-reto-id="2"
                                                data-reto-nombre="App de reservas"
                                                data-reto-descripcion="Aplicación web para gestión de citas, horarios y disponibilidad de salas."
                                                data-reto-grupo-id="2">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <form action="#" method="post" class="m-0 d-inline">
                                            <button type="submit" class="btn--row-finish">
                                                <i class="bi bi-flag"></i>
                                                <span>Finalizar Reto</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <!-- =========================================================================
                     MODAL 1: NUEVO RETO
                     BACKEND (AdminController.java & Reto.java):
                     - Añadir th:action="@{/admin/retos}" (ajustar al @PostMapping correspondiente).
                     - Atributos name="nombre", name="descripcion" y name="grupoId".
                     ========================================================================= -->
                <div class="modal-overlay d-none" id="modal-nuevo-reto" role="dialog" aria-modal="true" aria-labelledby="modal-reto-title">
                    <div class="modal-card">
                        <div class="modal-card__header">
                            <h2 id="modal-reto-title" class="modal-card__title">Nuevo Reto</h2>
                            <button type="button" class="icon-btn" data-modal-close aria-label="Cerrar modal">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <form action="#" method="post">
                            
                            <!-- Campo 1: Nombre del reto -->
                            <div class="mb-3">
                                <label for="reto-nombre" class="login-label">Nombre del reto</label>
                                <input type="text" 
                                       id="reto-nombre" 
                                       name="nombre" 
                                       class="pill-input pill-input--plain" 
                                       required>
                            </div>

                            <!-- Campo 2: Descripción -->
                            <div class="mb-3">
                                <label for="reto-descripcion" class="login-label">Descripción</label>
                                <textarea id="reto-descripcion" 
                                          name="descripcion" 
                                          class="lauki-textarea" 
                                          rows="3"></textarea>
                            </div>

                            <!-- Campo 3: Asignar a grupo -->
                            <div class="mb-4">
                                <label for="reto-grupo" class="login-label">Asignar a grupo</label>
                                <div class="lauki-select" data-custom-select>
                                    <!-- BACKEND (Grupo.java): Poblar opciones con th:each="grupo : ${grupos}"
                                         th:value="${grupo.id}" th:text="${grupo.nombre}" -->
                                    <select id="reto-grupo" name="grupoId" class="d-none" required>
                                        <option value="" selected disabled>Selecciona un grupo</option>
                                        <option value="1">Equipo Alfa</option>
                                        <option value="2">Equipo Beta</option>
                                    </select>

                                    <button type="button" class="lauki-select__trigger" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="lauki-select__value is-placeholder">Selecciona un grupo</span>
                                        <i class="bi bi-chevron-down lauki-select__arrow"></i>
                                    </button>

                                    <ul class="lauki-select__menu d-none" role="listbox"></ul>
                                </div>
                            </div>

                            <div class="modal-card__footer">
                                <button type="button" class="btn--ghost" data-modal-close>
                                    Cancelar
                                </button>
                                <button type="submit" class="btn--primary">
                                    Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- =========================================================================
                     MODAL 2: EDITAR RETO (Se abre al pulsar el icono del lápiz en la tabla)
                     BACKEND (AdminController.java & Reto.java):
                     - Añadir th:action="@{/admin/retos/editar}" (o ruta PUT/POST correspondiente).
                     ========================================================================= -->
                <div class="modal-overlay d-none" id="modal-editar-reto" role="dialog" aria-modal="true" aria-labelledby="modal-editar-reto-title">
                    <div class="modal-card">
                        <div class="modal-card__header">
                            <h2 id="modal-editar-reto-title" class="modal-card__title">Editar Reto</h2>
                            <button type="button" class="icon-btn" data-modal-close aria-label="Cerrar modal">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>

                        <form action="#" method="post">
                            <input type="hidden" id="edit-reto-id" name="id">

                            <div class="mb-3">
                                <label for="edit-reto-nombre" class="login-label">Nombre del reto</label>
                                <input type="text" 
                                       id="edit-reto-nombre" 
                                       name="nombre" 
                                       class="pill-input pill-input--plain" 
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="edit-reto-descripcion" class="login-label">Descripción</label>
                                <textarea id="edit-reto-descripcion" 
                                          name="descripcion" 
                                          class="lauki-textarea" 
                                          rows="3"></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="edit-reto-grupo" class="login-label">Asignar a grupo</label>
                                <div class="lauki-select" data-custom-select>
                                    <select id="edit-reto-grupo" name="grupoId" class="d-none" required>
                                        <option value="" disabled>Selecciona un grupo</option>
                                        <option value="1">Equipo Alfa</option>
                                        <option value="2">Equipo Beta</option>
                                    </select>

                                    <button type="button" class="lauki-select__trigger" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="lauki-select__value is-placeholder">Selecciona un grupo</span>
                                        <i class="bi bi-chevron-down lauki-select__arrow"></i>
                                    </button>

                                    <ul class="lauki-select__menu d-none" role="listbox"></ul>
                                </div>
                            </div>

                            <div class="modal-card__footer">
                                <button type="button" class="btn--ghost" data-modal-close>
                                    Cancelar
                                </button>
                                <button type="submit" class="btn--primary">
                                    Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts (Solo vista previa VS Code) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" th:remove="all"></script>
    <script src="../../static/js/main.js" th:remove="all"></script>
</body>
</html>
